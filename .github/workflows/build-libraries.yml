name: Build workshop libraries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libraries.yml'
permissions:
  contents: read
jobs:
  revision:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - id: resolve
        run: echo "commit=$(git ls-remote https://github.com/falcosecurity/libs.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
  build:
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build, relocate, and capture with all three stages
        env:
          FALCO_COMMIT: ${{ needs.revision.outputs.commit }}
        run: bash maintainer/build-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.arch }}
          path: .artifacts/dist/*
          if-no-files-found: error
  publish:
    needs: [revision, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          merge-multiple: true
          path: dist
      - name: Publish tested libraries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.revision.outputs.commit }}
        run: |
          printf 'Ubuntu 24.04 libraries for x86-64 and ARM64.\n\nFalco source: https://github.com/falcosecurity/libs/commit/%s\n\nBoth bundles were relocated, linked into all three workshop stages, and exercised with live eBPF capture. Upstream licenses are included.\n' "$SOURCE_COMMIT" > notes.md
          gh release create sdk-2026-10-02-v1 dist/* --target "$GITHUB_SHA" --title 'Workshop libraries: Ubuntu 24.04' --notes-file notes.md
